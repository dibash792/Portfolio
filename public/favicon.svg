<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>

    <!-- Cyan to Azure Monogram Gradient -->
    <linearGradient id="cyanBlueGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="sparkGrad" x1="42" y1="12" x2="52" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Geometric DL Monogram -->
  <!-- Letter D (Upper Arc & Shared Spine) -->
  <path
    d="M17 15 H33 C41.284 15 48 21.716 48 30 C48 38.284 41.284 45 33 45 H25"
    stroke="url(#cyanBlueGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Letter L (Continuous Base Anchor) -->
  <path
    d="M17 15 V49 H49"
    stroke="url(#cyanBlueGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Geometric Luminous Accent Spark (Upper Right) -->
  <circle cx="48" cy="16" r="3.5" fill="url(#sparkGrad)" />
</svg>
